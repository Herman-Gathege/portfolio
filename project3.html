<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-commerce project</title>
  <link rel="stylesheet" href="project2.css"> <!-- Link to the external CSS file -->
</head>

<body>
  <div class="slideshow-container">
    <img src="images/everyday-finds/slide a.png" alt="Slide 1" class="slides active" loading="lazy">
    <img src="images/everyday-finds/slide b.png" alt="Slide 2" class="slides" loading="lazy">
    <img src="images/everyday-finds/slide c.png" alt="Slide 3" class="slides" loading="lazy">
    <img src="images/everyday-finds/slide d.png" alt="Slide 4" class="slides" loading="lazy">
    <img src="images/everyday-finds/slide e.png" alt="Slide 5" class="slides" loading="lazy">



    <div class="navigation">
      <button class="nav-button button-secondary" onclick="prevSlide()">← Previous</button>
      <button class="nav-button button-primary" onclick="nextSlide()">Next →</button>

      <!-- Ghost Style for Homepage Link -->
      <a href="index.html" class="button-ghost">Home</a>

      <!-- Gradient Button for View Site Link -->
      <a href="https://e-commerce-template-63p3.onrender.com/" target="_blank" class="button-gradient">View Site</a>
    </div>

    <div class="dots">
      <span class="dot" onclick="showSlide(0)"></span>
      <span class="dot" onclick="showSlide(1)"></span>
      <span class="dot" onclick="showSlide(2)"></span>
      <span class="dot" onclick="showSlide(3)"></span>
      <span class="dot" onclick="showSlide(4)"></span>
    </div>

  </div>

  <script src="project2.js"></script> <!-- Link to the external JS file -->

</body>

</html>
