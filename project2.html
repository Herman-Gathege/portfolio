<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipe Room</title>
  <link rel="stylesheet" href="project2.css"> <!-- Link to the external CSS file -->
</head>

<body>
  <div class="slideshow-container">
    <img src="images/recipe-room/slide 1.png" alt="Slide 1" class="slides active" loading="lazy">
    <img src="images/recipe-room/slide 2.png" alt="Slide 2" class="slides" loading="lazy">
    <img src="images/recipe-room/slide 3.png" alt="Slide 3" class="slides" loading="lazy">
    <img src="images/recipe-room/slide 4.png" alt="Slide 4" class="slides" loading="lazy">
    <img src="images/recipe-room/slide 5.png" alt="Slide 5" class="slides" loading="lazy">
    <img src="images/recipe-room/slide 6.png" alt="Slide 6" class="slides" loading="lazy">
    <img src="images/recipe-room/slide 7.png" alt="Slide 7" class="slides" loading="lazy">



    <div class="navigation">
      <button class="nav-button button-secondary" onclick="prevSlide()">← Previous</button>
      <button class="nav-button button-primary" onclick="nextSlide()">Next →</button>

      <!-- Ghost Style for Homepage Link -->
      <a href="index.html" class="button-ghost">Home</a>

      <!-- Gradient Button for View Site Link -->
      <a href="https://www.figma.com/proto/3ztI6BhJ8W9FgMOqJ1m4vb/recipe-website?node-id=1-2&starting-point-node-id=1%3A2"
        target="_blank" class="button-gradient">View Prototype</a>
    </div>

    <div class="dots">
      <span class="dot" onclick="showSlide(0)"></span>
      <span class="dot" onclick="showSlide(1)"></span>
      <span class="dot" onclick="showSlide(2)"></span>
      <span class="dot" onclick="showSlide(3)"></span>
      <span class="dot" onclick="showSlide(4)"></span>
      <span class="dot" onclick="showSlide(5)"></span>
      <span class="dot" onclick="showSlide(6)"></span>

    </div>

  </div>

  <script src="project2.js"></script>
</body>

</html>
